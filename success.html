<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Yay! ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="success-page">
    <div class="language-selector">
        <button class="lang-btn" id="langBtn" onclick="toggleLanguageMenu()">🌐</button>
        <div class="lang-menu" id="langMenu">
            <button class="lang-option" onclick="changeLanguage('tr')">🇹🇷 TR</button>
            <button class="lang-option" onclick="changeLanguage('en')">🇬🇧 EN</button>
            <button class="lang-option" onclick="changeLanguage('cs')">🇨🇿 CS</button>
        </div>
    </div>
    <div class="container">
        <div class="card success-card">
            <div class="card-content">
                <h1 class="success-title">Yay! 🎉</h1>
                <p class="success-subtitle">Best decision ever! ✨</p>
                <div class="gif-container">
                    <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExeTRmbzVyd3cwcWQxNjhudXI4aHR6dTY0OXJsMmd3ZDZtNmduYng3cSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/BzCFyNz8bCE75hXi6K/giphy.gif" alt="Celebration GIF" class="love-gif">
                </div>
                <p class="love-message">I love you ❤️</p>
            </div>
        </div>
    </div>
    <script src="translations.js"></script>
    <script src="language.js"></script>
</body>
</html>
